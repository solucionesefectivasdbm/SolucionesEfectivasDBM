# OpenSpec configuration — SDD project context
# Generated by sdd-init. All artifacts are written in English.

project: solucionesefectivasdbm
artifact_store: hybrid # OpenSpec files + Engram observations
execution_mode: interactive
delivery_strategy: ask-on-risk
review_budget_lines: 400

context: |
  Loan/credit management system (Soluciones Efectivas).
  Backend: Python 3 + FastAPI + SQLAlchemy 2.x async + PostgreSQL (asyncpg), Alembic migrations, JWT auth.
  Frontend: React 18 + TypeScript 5 + Vite 5 + Tailwind 3, Zustand store, axios, react-hook-form + zod.
  Deploy: backend on Railway (Procfile -> start.sh, self-healing alembic stamp+upgrade); frontend on Vercel
  with same-origin /api/* rewrite proxy to Railway (first-party auth cookies).
  All financial math lives in the backend using Decimal; the frontend only displays computed values.
  Conventions are documented in AGENTS.md (Spanish) and are authoritative for code review.

strict_tdd:
  backend: true # pytest + pytest-asyncio, 223 tests collected
  frontend: false # no test infrastructure exists

testing:
  backend:
    runner: pytest
    framework: pytest 8.3.4 + pytest-asyncio 0.24.0 (asyncio_mode=auto)
    command: cd backend && python -m pytest
    command_windows: backend/venv/Scripts/python.exe -m pytest
    testpaths: backend/tests
    layers:
      unit: true # tests/test_*_service.py, test_models.py, test_schema_credito.py
      integration: true # httpx AsyncClient + aiosqlite in-memory DB (tests/conftest.py)
      e2e: false
    coverage:
      available: false # pytest-cov not installed
      command: null
  frontend:
    runner: null
    framework: null
    command: null
    layers:
      unit: false
      integration: false
      e2e: false
    coverage:
      available: false
      command: null

quality:
  backend:
    linter: null # no ruff/flake8/black configured
    type_checker: null # no mypy configured
    formatter: null
  frontend:
    linter: null # no eslint configured
    type_checker: cd frontend && npx tsc --noEmit
    formatter: null
    build: cd frontend && npm run build # runs `tsc && vite build`

migrations:
  tool: alembic
  version: 1.14.0
  config: backend/alembic.ini
  versions_dir: backend/alembic/versions
  baseline_revision: d9144df95951
  run_on_deploy: true # backend/start.sh stamps baseline if unstamped, then `alembic upgrade head`
  notes: |
    Migration failures are logged but do NOT abort startup (uvicorn always boots).
    Per AGENTS.md, schema changes affecting existing rows may also be applied idempotently
    in the `startup_create_tables` hook of backend/app/main.py.

rules:
  proposal: State problem, scope, non-goals, and rollback. Keep backend/frontend impact explicit.
  spec: Write requirement scenarios in English; financial rules must specify Decimal semantics.
  design: Required only for cross-cutting or schema/migration changes.
  tasks: Forecast the 400-line review budget; recommend chained PRs when High.
  apply: Strict TDD for backend (red-green-refactor). Standard flow for frontend (no test runner).
  verify: Run `python -m pytest` for backend and `npx tsc --noEmit` for frontend type safety.
  archive: Move the change folder to openspec/changes/archive/ after merge.
